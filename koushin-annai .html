<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>更新案内メール作成</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1a2e;
    --sub: #667085;
    --accent: #6c5ce7;
    --accent-text: #ffffff;
    --border: #d8dce3;
    --preview-bg: #fafbfc;
    --ng: #e05252;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card: #1f2128;
      --text: #eceef2;
      --sub: #9aa1ad;
      --accent: #8b7cf7;
      --accent-text: #ffffff;
      --border: #3a3d46;
      --preview-bg: #17181d;
      --ng: #ff7b7b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
  }
  h1 { font-size: 19px; margin: 0 0 16px; }
  label { display: block; font-size: 14px; color: var(--sub); margin: 14px 0 6px; }
  input[type="text"] {
    width: 100%;
    padding: 13px 14px;
    font-size: 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    color: var(--text);
  }
  .toggle {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .toggle button {
    flex: 1;
    padding: 13px 0;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    cursor: pointer;
  }
  .toggle button.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    font-weight: bold;
  }
  .hint {
    margin-top: 8px;
    font-size: 14px;
    color: var(--sub);
  }
  .hint.err { color: var(--ng); }
  .actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .actions button {
    flex: 1;
    padding: 15px 0;
    font-size: 16px;
    font-weight: bold;
    border-radius: 10px;
    border: none;
    cursor: pointer;
  }
  #btnCopy {
    background: var(--accent);
    color: var(--accent-text);
  }
  #btnCopy:disabled { opacity: .45; }
  textarea {
    width: 100%;
    margin-top: 16px;
    min-height: 420px;
    padding: 14px;
    font-size: 14.5px;
    line-height: 1.7;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--preview-bg);
    color: var(--text);
    resize: vertical;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    background: var(--accent);
    color: var(--accent-text);
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: bold;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="card">
  <a href="./teitop.html" style="display:inline-block;margin-bottom:12px;font-size:13px;color:var(--accent);text-decoration:none;">← 一覧に戻る</a>
  <h1>更新案内メール作成</h1>

  <label>お名前（様は自動でつく）</label>
  <input type="text" id="inpName" placeholder="例）山田" autocomplete="off">

  <label>契約満了日（コピペOK）</label>
  <input type="text" id="inpDate" placeholder="例）2026年9月5日 / 9/5 / 2026-09-05" autocomplete="off">
  <div class="hint" id="dateHint">対応形式: 2026年9月5日・9月5日・2026/9/5・9/5・2026-09-05（年なしは自動で今年/来年）</div>

  <label>振込期日（満了日の何日前）</label>
  <div class="toggle">
    <button type="button" id="btn5" class="active">5日前</button>
    <button type="button" id="btn10">10日前</button>
  </div>
  <div class="hint" id="deadlinePreview"></div>

  <label>内勤名（差出人）</label>
  <input type="text" id="inpSender" value="篠原" autocomplete="off">

  <div class="actions">
    <button type="button" id="btnCopy" disabled>コピー</button>
  </div>

  <textarea id="outText" placeholder="名前と満了日を入れると本文がここに出るよ"></textarea>
</div>

<div class="toast" id="toast">コピーしたよ</div>

<script>
  let offset = 5;

  const inpName = document.getElementById('inpName');
  const inpDate = document.getElementById('inpDate');
  const inpSender = document.getElementById('inpSender');
  const btn5 = document.getElementById('btn5');
  const btn10 = document.getElementById('btn10');
  const outText = document.getElementById('outText');
  const btnCopy = document.getElementById('btnCopy');
  const deadlinePreview = document.getElementById('deadlinePreview');
  const dateHint = document.getElementById('dateHint');
  const toast = document.getElementById('toast');

  // 前回使った内勤名を覚えておく(このブラウザ内だけ)
  try {
    const saved = localStorage.getItem('koushin_sender');
    if (saved) inpSender.value = saved;
  } catch (e) {}

  // 全角数字→半角に直してから日付を解釈する
  function normalize(s) {
    return s.replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
            .replace(/[／]/g, '/')
            .replace(/[．]/g, '.')
            .replace(/[－ー―]/g, '-')
            .replace(/\s+/g, '');
  }

  // いろんな形式の日付文字列をDateにする。ダメならnull
  function parseDate(raw) {
    const s = normalize(raw);
    if (!s) return null;

    let y = null, m = null, d = null;
    let match;

    // 2026年9月5日 / 9月5日
    if ((match = s.match(/^(?:(\d{4})年)?(\d{1,2})月(\d{1,2})日?$/))) {
      y = match[1] ? Number(match[1]) : null;
      m = Number(match[2]);
      d = Number(match[3]);
    }
    // 2026/9/5, 2026-9-5, 2026.9.5
    else if ((match = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/))) {
      y = Number(match[1]);
      m = Number(match[2]);
      d = Number(match[3]);
    }
    // 9/5, 9-5, 9.5
    else if ((match = s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/))) {
      m = Number(match[1]);
      d = Number(match[2]);
    }
    // 20260905 / 0905
    else if ((match = s.match(/^(\d{4})(\d{2})(\d{2})$/))) {
      y = Number(match[1]);
      m = Number(match[2]);
      d = Number(match[3]);
    }
    else if ((match = s.match(/^(\d{2})(\d{2})$/))) {
      m = Number(match[1]);
      d = Number(match[2]);
    }
    else {
      return null;
    }

    if (m < 1 || m > 12 || d < 1 || d > 31) return null;

    // 年が無ければ今年。ただしその日付が既に過去なら来年扱い(満了日は未来のはずなので)
    if (y === null) {
      const now = new Date();
      y = now.getFullYear();
      const candidate = new Date(y, m - 1, d);
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (candidate < today) y += 1;
    }

    const date = new Date(y, m - 1, d);
    // 2月31日みたいな存在しない日付を弾く
    if (date.getFullYear() !== y || date.getMonth() !== m - 1 || date.getDate() !== d) return null;
    return date;
  }

  function fmtFull(d) {
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function fmtMD(d) {
    return (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }

  function buildBody(name, endDate, payDate, sender) {
    return name + '様\n'
      + 'いつもセラピスト活動ご苦労様です。\n'
      + '\n'
      + 'また帝の業務にご協力頂きありがとうございます。\n'
      + '帝事務局の' + sender + 'です。\n'
      + '\n'
      + '入れ違いの連絡であれば申し訳ありません。\n'
      + '\n'
      + 'また、更新費の免除条件をクリアされている方は入れ違いの連絡ですのでお手数ですが条件クリアの旨をご返信お願いします。\n'
      + '\n'
      + 'さて早いもので' + fmtFull(endDate) + 'にて\n'
      + '貴殿とのセラピスト業務委託契約が満了となります。\n'
      + '\n'
      + '3か月間の成果はいかがでしたでしょうか？\n'
      + '充実したものだったでしょうか？\n'
      + '\n'
      + '中々、思うような結果が得られなかった方は、技術スキル向上のための再講習などバックアップ態勢も準備させて頂いております。\n'
      + '\n'
      + 'ご要望があればお気軽に事務局までお問い合わせください。\n'
      + '\n'
      + '\n'
      + 'つきましてはセラピスト契約を更新される場合は3ヶ月分10,000円の更新料をお納めいただきまして、セラピスト登録を3ヶ月継続更新させていただきます。\n'
      + '\n'
      + 'セラピスト契約の更新を希望されない場合は『更新しません』と返信ください。\n'
      + '\n'
      + '更新される際の振込先は、\n'
      + '\n'
      + 'ーーーーーーーーー\n'
      + 'セブン銀行\n'
      + 'ポインセチア支店\n'
      + '普通（112）\n'
      + '3785603\n'
      + 'サダキョウ　トシキ\n'
      + 'ーーーーーーーーー\n'
      + '\n'
      + 'こちらへ' + fmtMD(payDate) + 'までに更新料10,000円を振り込みの上、詳細メールの送信をお願いします。（3ヶ月間で20ポイント以上獲得（初回更新の方は10ポイント獲得）で免除が可能です。直近の売上があれば相殺も可です。\n'
      + '）\n'
      + '\n'
      + 'よろしくお願いします。\n'
      + '帝事務局　' + sender;
  }

  function update() {
    const name = inpName.value.trim();
    const raw = inpDate.value.trim();
    const sender = inpSender.value.trim() || '篠原';

    try { localStorage.setItem('koushin_sender', inpSender.value.trim()); } catch (e) {}

    if (!raw) {
      dateHint.textContent = '対応形式: 2026年9月5日・9月5日・2026/9/5・9/5・2026-09-05（年なしは自動で今年/来年）';
      dateHint.classList.remove('err');
      deadlinePreview.textContent = '';
      outText.value = '';
      btnCopy.disabled = true;
      return;
    }

    const endDate = parseDate(raw);
    if (!endDate) {
      dateHint.textContent = '日付として読めなかった…形式を確認してみて';
      dateHint.classList.add('err');
      deadlinePreview.textContent = '';
      outText.value = '';
      btnCopy.disabled = true;
      return;
    }

    dateHint.textContent = '→ 満了日: ' + fmtFull(endDate);
    dateHint.classList.remove('err');

    const payDate = new Date(endDate);
    payDate.setDate(payDate.getDate() - offset);
    deadlinePreview.textContent = '→ 振込期日: ' + fmtFull(payDate);

    if (!name) {
      outText.value = '';
      btnCopy.disabled = true;
      return;
    }

    outText.value = buildBody(name, endDate, payDate, sender);
    btnCopy.disabled = false;
  }

  function setOffset(v) {
    offset = v;
    btn5.classList.toggle('active', v === 5);
    btn10.classList.toggle('active', v === 10);
    update();
  }

  btn5.addEventListener('click', () => setOffset(5));
  btn10.addEventListener('click', () => setOffset(10));
  inpName.addEventListener('input', update);
  inpDate.addEventListener('input', update);
  inpSender.addEventListener('input', update);

  btnCopy.addEventListener('click', () => {
    const doToast = () => {
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(outText.value).then(doToast).catch(() => {
        outText.select();
        document.execCommand('copy');
        doToast();
      });
    } else {
      outText.select();
      document.execCommand('copy');
      doToast();
    }
  });
</script>
</body>
</html>
