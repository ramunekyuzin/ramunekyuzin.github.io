<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Search Console用: 新しい所有権確認メタタグを発行したらここに貼る -->
  <!-- <meta name="google-site-verification" content="ここに貼る"> -->
  <title>ラムネ｜全国の風俗求人・高収入バイト</title>
  <meta name="description" content="ラムネは全国の風俗求人・高収入バイトの求人サイト。女性キャスト・男性セラピスト(女性用風俗)・内勤スタッフの求人を都道府県、エリア、業種、こだわり条件から探せます。">
  <style>
    :root {
      --blue: #29a8e0; --blue-dark: #1b7fb0; --blue-pale: #e7f5fc;
      --pink: #ff7ba3; --text: #2b3947; --sub: #7b8a99; --line-green: #06c755;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: #f3f9fc; color: var(--text); }
    .wrap { max-width: 560px; margin: 0 auto; padding: 0 12px 60px; }

    /* ヘッダー */
    header { background: linear-gradient(135deg, var(--blue), #55c3ee); color: #fff; padding: 16px 12px 12px; text-align: center; }
    header h1 { font-size: 26px; letter-spacing: 6px; }
    header p { font-size: 12px; opacity: .95; margin-top: 2px; }

    /* 募集区分タブ */
    .tabs { display: flex; background: #fff; border-bottom: 2px solid var(--blue-pale); position: sticky; top: 0; z-index: 20; }
    .tabs button { flex: 1; padding: 13px 2px; font-size: 13px; font-weight: bold; border: none; background: none; color: var(--sub); border-bottom: 3px solid transparent; }
    .tabs button.on { color: var(--blue-dark); border-bottom-color: var(--blue); }

    /* 検索パネル */
    .panel { background: #fff; border-radius: 12px; padding: 14px; margin: 12px 0; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .panel label { display: block; font-size: 12px; color: var(--sub); margin: 8px 0 4px; }
    .panel input, .panel select { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d5e3ec; border-radius: 8px; background: #fff; }
    .row2 { display: flex; gap: 8px; }
    .row2 > div { flex: 1; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { padding: 7px 12px; font-size: 12px; border-radius: 999px; border: 1px solid #cfe3ef; background: #fff; color: var(--text); }
    .chip.on { background: var(--blue); border-color: var(--blue); color: #fff; }
    .toolbar { display: flex; gap: 8px; margin: 10px 0 4px; align-items: center; }
    .toolbar .chip.pink.on { background: var(--pink); border-color: var(--pink); }
    .toolbar .spacer { flex: 1; }
    #count { font-size: 12px; color: var(--sub); }
    #togglePanel { width: 100%; padding: 10px; font-size: 13px; font-weight: bold; color: var(--blue-dark); background: var(--blue-pale); border: none; border-radius: 8px; margin-top: 10px; }

    /* LINEバナー */
    .lineBanner { display: block; background: var(--line-green); color: #fff; text-decoration: none; border-radius: 12px; padding: 13px; text-align: center; font-weight: bold; font-size: 14px; margin: 12px 0; }
    .lineBanner small { display: block; font-weight: normal; font-size: 11px; opacity: .95; margin-top: 2px; }

    /* 求人カード */
    .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); position: relative; }
    .card .shop { font-size: 16px; font-weight: bold; padding-right: 40px; }
    .card .meta { font-size: 12px; color: var(--sub); margin: 3px 0 6px; }
    .card .salary { font-size: 15px; color: #e0554a; font-weight: bold; }
    .card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
    .card .tags span { font-size: 11px; background: var(--blue-pale); color: var(--blue-dark); border-radius: 4px; padding: 3px 7px; }
    .badge-new { display: inline-block; font-size: 10px; background: var(--pink); color: #fff; border-radius: 4px; padding: 2px 6px; margin-right: 5px; vertical-align: 2px; }
    .fav { position: absolute; top: 10px; right: 10px; font-size: 22px; background: none; border: none; color: #ccd6de; padding: 6px; }
    .fav.on { color: var(--pink); }
    .empty { text-align: center; color: var(--sub); font-size: 14px; padding: 40px 0; }

    /* 詳細モーダル */
    .modal-bg { position: fixed; inset: 0; background: rgba(20,40,55,.55); z-index: 50; display: none; }
    .modal-bg.show { display: flex; align-items: flex-end; justify-content: center; }
    .modal { background: #fff; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 18px 16px 28px; }
    .modal h2 { font-size: 18px; padding-right: 30px; }
    .modal .close { position: absolute; margin-left: calc(100% - 40px); margin-top: -4px; font-size: 24px; background: none; border: none; color: var(--sub); }
    .modal .meta { font-size: 12px; color: var(--sub); margin: 4px 0 10px; }
    .dl { font-size: 14px; margin-bottom: 10px; }
    .dl dt { font-size: 11px; color: var(--sub); margin-top: 10px; }
    .dl dd { margin-top: 2px; white-space: pre-wrap; line-height: 1.7; }
    .btnL, .btnT, .btnC { display: block; width: 100%; padding: 15px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; text-align: center; text-decoration: none; margin-top: 10px; color: #fff; }
    .btnL { background: var(--line-green); }
    .btnT { background: var(--blue); }
    .btnC { background: #fff; color: var(--blue-dark); border: 2px solid var(--blue); }
    .note { font-size: 11px; color: var(--sub); margin-top: 8px; text-align: center; }

    /* 年齢認証 */
    #ageGate { position: fixed; inset: 0; background: rgba(20,40,55,.92); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px; }
    #ageGate .box { background: #fff; border-radius: 16px; padding: 26px 20px; max-width: 340px; text-align: center; }
    #ageGate h2 { font-size: 20px; color: var(--blue-dark); margin-bottom: 10px; }
    #ageGate p { font-size: 13px; line-height: 1.7; margin-bottom: 16px; }
    #ageGate button { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; margin-top: 8px; }
    #ageYes { background: var(--blue); color: #fff; }
    #ageNo { background: #eef2f5; color: var(--sub); }

    footer { text-align: center; font-size: 11px; color: var(--sub); padding: 24px 12px; line-height: 1.9; }
    footer a { color: var(--blue-dark); }
  </style>
</head>
<body>

  <!-- 18歳未満お断り 年齢認証 -->
  <div id="ageGate" style="display:none;">
    <div class="box">
      <h2>年齢確認</h2>
      <p>このサイトは風俗・ナイトワークの求人情報を含みます。<br>あなたは18歳以上ですか？</p>
      <button id="ageYes" onclick="ageOk()">はい、18歳以上です</button>
      <button id="ageNo" onclick="location.href='https://www.google.com'">いいえ、退出する</button>
    </div>
  </div>

  <header>
    <h1>ラムネ</h1>
    <p>全国の風俗求人・高収入バイト</p>
  </header>

  <!-- 募集区分タブ -->
  <nav class="tabs">
    <button data-type="cast" class="on" onclick="setType('cast')">女性キャスト</button>
    <button data-type="therapist" onclick="setType('therapist')">男性セラピスト</button>
    <button data-type="staff" onclick="setType('staff')">内勤スタッフ</button>
  </nav>

  <div class="wrap">

    <!-- 検索パネル -->
    <div class="panel" id="searchPanel">
      <label>キーワード</label>
      <input id="kw" placeholder="店名・給与・フリーワード" oninput="render()">
      <div class="row2">
        <div>
          <label>都道府県</label>
          <select id="pref" onchange="onPref()"></select>
        </div>
        <div>
          <label>エリア</label>
          <select id="area" onchange="render()"></select>
        </div>
      </div>
      <label>業種</label>
      <select id="genre" onchange="render()"></select>
      <label>こだわり条件</label>
      <div class="chips" id="featChips"></div>
    </div>

    <div class="toolbar">
      <button class="chip" id="sortNew" onclick="toggleSort()">新着順</button>
      <button class="chip pink" id="favView" onclick="toggleFav()">♡ 気になるリスト</button>
      <div class="spacer"></div>
      <span id="count"></span>
    </div>

    <a class="lineBanner" href="https://lin.ee/z5CeSby" target="_blank" rel="noopener" onclick="logEv('line_tap','','','banner')">
      ＼ ラムネ公式LINE ／ 友だち追加はこちら
      <small>新着求人やお得な情報をお届け</small>
    </a>

    <div id="list"></div>

    <footer>
      当サイトは18歳未満の方のご利用をお断りしています。<br>
      運営: ラムネ運営事務局<br>
      お問い合わせ: <a href="mailto:ramune.kyuzin@gmail.com">メールはこちら</a>
    </footer>
  </div>

  <!-- 詳細モーダル -->
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modalBody"></div>
  </div>

  <script>
    // ============================================
    // 設定: GASのWebアプリURLをここに入れる
    // ============================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwqxzZWCW1wQ5pbDApf_XgBmLc-wiki6Ka7pFa5LLaJphXeefInnaF5PPSJWEcRcqZm/exec';

    const TYPE_LABEL = { cast: '女性キャスト', therapist: '男性セラピスト', staff: '内勤スタッフ' };

    // 区分ごとのこだわり条件タグ(admin.html側と同じリストにしておくこと)
    const FEATURES = {
      cast: ['日払いOK','未経験歓迎','体験入店OK','自由出勤','送迎あり','寮・引越しサポート','託児所あり','個室待機','顔出し不要','短期OK','30代・40代歓迎','ノルマなし'],
      therapist: ['未経験歓迎','講習・研修あり','容姿・年齢不問','副業・Wワーク可','日払いOK','歩合率高め','完全出来高','身バレ対策あり','地方出張あり'],
      staff: ['日払いOK','未経験歓迎','週1日〜OK','短時間OK','深夜手当あり','昇給・独立支援','服装・髪型自由','電話対応のみ','送りドライバー','寮あり'],
    };

    const PREFS = ['北海道','青森県','岩手県','宮城県','秋田県','山形県','福島県','茨城県','栃木県','群馬県','埼玉県','千葉県','東京都','神奈川県','新潟県','富山県','石川県','福井県','山梨県','長野県','岐阜県','静岡県','愛知県','三重県','滋賀県','京都府','大阪府','兵庫県','奈良県','和歌山県','鳥取県','島根県','岡山県','広島県','山口県','徳島県','香川県','愛媛県','高知県','福岡県','佐賀県','長崎県','熊本県','大分県','宮崎県','鹿児島県','沖縄県'];

    let ALL = [];                 // 全求人
    let state = { type: 'cast', sort: 'rec', favOnly: false, feats: [] };
    let FAVS = JSON.parse(localStorage.getItem('ramune_favs') || '[]');
    const SRC = new URLSearchParams(location.search).get('src') || '';

    // ---------- 年齢認証 ----------
    function ageOk() {
      localStorage.setItem('ramune_age_ok', '1');
      document.getElementById('ageGate').style.display = 'none';
    }
    if (!localStorage.getItem('ramune_age_ok')) {
      document.getElementById('ageGate').style.display = 'flex';
    }

    // ---------- API ----------
    function api(payload) {
      return fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload) })
        .then(r => r.json());
    }
    function logEv(event, storeId, jobId, srcTag) {
      api({ action: 'log', data: { event: event, storeId: storeId, jobId: jobId, src: srcTag || SRC } }).catch(() => {});
    }

    // ---------- 初期化 ----------
    function init() {
      // ディープリンク処理 ?view=fav / ?view=search / ?sort=new
      const q = new URLSearchParams(location.search);
      if (q.get('sort') === 'new') state.sort = 'new';
      if (q.get('view') === 'fav') state.favOnly = true;
      if (q.get('view') === 'search') setTimeout(() => document.getElementById('kw').focus(), 300);

      const prefSel = document.getElementById('pref');
      prefSel.innerHTML = '<option value="">すべての都道府県</option>' + PREFS.map(p => `<option>${p}</option>`).join('');
      document.getElementById('area').innerHTML = '<option value="">すべてのエリア</option>';

      renderChips();
      syncToolbar();
      logEv('pv', '', '');

      api({ action: 'list' }).then(res => {
        if (!res.ok) throw new Error(res.error);
        ALL = res.result;
        buildSelects();
        render();
      }).catch(err => {
        document.getElementById('list').innerHTML = `<div class="empty">読み込みエラー: ${err}</div>`;
      });
    }

    // ---------- タブ・条件 ----------
    function setType(t) {
      state.type = t;
      state.feats = [];
      document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.type === t));
      renderChips();
      buildSelects();
      render();
    }

    function renderChips() {
      document.getElementById('featChips').innerHTML = FEATURES[state.type]
        .map(f => `<button class="chip ${state.feats.includes(f) ? 'on' : ''}" onclick="toggleFeat('${f}')">${f}</button>`).join('');
    }
    function toggleFeat(f) {
      state.feats = state.feats.includes(f) ? state.feats.filter(x => x !== f) : [...state.feats, f];
      renderChips();
      render();
    }
    function toggleSort() {
      state.sort = state.sort === 'new' ? 'rec' : 'new';
      syncToolbar(); render();
    }
    function toggleFav() {
      state.favOnly = !state.favOnly;
      syncToolbar(); render();
    }
    function syncToolbar() {
      document.getElementById('sortNew').classList.toggle('on', state.sort === 'new');
      document.getElementById('favView').classList.toggle('on', state.favOnly);
    }

    function areasOf(j) {
      return String(j.area || '').split(/[,、，]/).map(x => x.trim()).filter(Boolean);
    }

    function buildSelects() {
      const pool = ALL.filter(j => j.type === state.type);
      const prefSel = document.getElementById('pref');
      onPref(true);
      const genres = [...new Set(pool.map(j => j.genre).filter(Boolean))];
      document.getElementById('genre').innerHTML =
        '<option value="">すべての業種</option>' + genres.map(g => `<option>${g}</option>`).join('');
    }
    function onPref(keep) {
      const pref = document.getElementById('pref').value;
      const areas = [...new Set(ALL.filter(j => j.type === state.type && (!pref || j.pref === pref)).flatMap(areasOf))];
      const areaSel = document.getElementById('area');
      const cur = keep ? areaSel.value : '';
      areaSel.innerHTML = '<option value="">すべてのエリア</option>' + areas.map(a => `<option>${a}</option>`).join('');
      if (cur && areas.includes(cur)) areaSel.value = cur;
      render();
    }

    // ---------- 描画 ----------
    function isNew(j) {
      if (!j.created) return false;
      return (Date.now() - new Date(j.created).getTime()) < 14 * 86400000;
    }

    function filtered() {
      const kw = document.getElementById('kw').value.trim().toLowerCase();
      const pref = document.getElementById('pref').value;
      const area = document.getElementById('area').value;
      const genre = document.getElementById('genre').value;
      let list = ALL.filter(j => j.type === state.type);
      if (state.favOnly) list = list.filter(j => FAVS.includes(j.job_id));
      if (pref) list = list.filter(j => j.pref === pref);
      if (area) list = list.filter(j => areasOf(j).includes(area));
      if (genre) list = list.filter(j => j.genre === genre);
      if (state.feats.length) list = list.filter(j => state.feats.every(f => (j.features || []).includes(f)));
      if (kw) list = list.filter(j => [j.shop, j.title, j.salary, j.body, j.area, j.genre].join(' ').toLowerCase().includes(kw));
      if (state.sort === 'new') {
        list.sort((a, b) => String(b.created).localeCompare(String(a.created)));
      } else {
        list.sort((a, b) => (a.storeOrder - b.storeOrder) || (a.jobOrder - b.jobOrder) || String(b.created).localeCompare(String(a.created)));
      }
      return list;
    }

    function render() {
      const list = filtered();
      document.getElementById('count').textContent = list.length + '件';
      if (!list.length) {
        document.getElementById('list').innerHTML =
          `<div class="empty">${state.favOnly ? '気になる保存した求人はまだないよ' : '条件に合う求人が見つかりませんでした'}</div>`;
        return;
      }
      document.getElementById('list').innerHTML = list.map(j => `
        <div class="card" onclick="openDetail('${j.job_id}')">
          <button class="fav ${FAVS.includes(j.job_id) ? 'on' : ''}" onclick="event.stopPropagation();toggleFavItem('${j.job_id}')">♥</button>
          <div class="shop">${isNew(j) ? '<span class="badge-new">NEW</span>' : ''}${esc(j.shop)}</div>
          <div class="meta">${esc(j.pref)} ${areasOf(j).map(esc).join('・')}｜${esc(j.genre)}｜${TYPE_LABEL[j.type]}${j.title ? '｜' + esc(j.title) : ''}</div>
          <div class="salary">${esc(j.salary)}</div>
          <div class="tags">${(j.features || []).map(f => `<span>${esc(f)}</span>`).join('')}</div>
        </div>`).join('');
    }

    // ---------- 気になる ----------
    function toggleFavItem(jobId) {
      const j = ALL.find(x => x.job_id === jobId);
      if (FAVS.includes(jobId)) {
        FAVS = FAVS.filter(x => x !== jobId);
      } else {
        FAVS.push(jobId);
        if (j) logEv('favorite', j.store_id, jobId);
      }
      localStorage.setItem('ramune_favs', JSON.stringify(FAVS));
      render();
    }

    // ---------- 詳細 ----------
    function openDetail(jobId) {
      const j = ALL.find(x => x.job_id === jobId);
      if (!j) return;
      logEv('detail', j.store_id, jobId);
      const tmpl = j.template || `ラムネの求人を見てご連絡しました。\n【${j.shop}】${TYPE_LABEL[j.type]}の募集に応募希望です。\nお名前:\n年齢:\n希望の連絡方法:`;
      document.getElementById('modalBody').innerHTML = `
        <button class="close" onclick="closeModal()">×</button>
        <h2>${isNew(j) ? '<span class="badge-new">NEW</span>' : ''}${esc(j.shop)}</h2>
        <div class="meta">${esc(j.pref)} ${areasOf(j).map(esc).join('・')}｜${esc(j.genre)}｜${TYPE_LABEL[j.type]}</div>
        <dl class="dl">
          ${j.title ? `<dt>募集</dt><dd>${esc(j.title)}</dd>` : ''}
          <dt>給与</dt><dd>${esc(j.salary) || '詳細はお問い合わせください'}</dd>
          ${j.hours ? `<dt>勤務時間</dt><dd>${esc(j.hours)}</dd>` : ''}
          ${(j.features || []).length ? `<dt>こだわり条件</dt><dd>${j.features.map(esc).join(' / ')}</dd>` : ''}
          ${j.body ? `<dt>お店から</dt><dd>${esc(j.body)}</dd>` : ''}
        </dl>
        ${j.line ? `<a class="btnL" href="${escAttr(j.line)}" target="_blank" rel="noopener" onclick="logEv('line_tap','${j.store_id}','${j.job_id}')">LINEで応募する</a>` : ''}
        ${j.tel ? `<a class="btnT" href="tel:${escAttr(j.tel)}" onclick="logEv('tel_tap','${j.store_id}','${j.job_id}')">電話で応募する</a>` : ''}
        <button class="btnC" onclick="copyTmpl('${j.store_id}','${j.job_id}')">応募メッセージをコピー</button>
        <textarea id="tmplText" style="position:absolute;left:-9999px;">${esc(tmpl)}</textarea>
        <div class="note">コピーした文をLINEやメールに貼って応募できます</div>`;
      document.getElementById('modalBg').classList.add('show');
    }
    function copyTmpl(storeId, jobId) {
      const text = document.getElementById('tmplText').value;
      navigator.clipboard.writeText(text).then(() => {
        logEv('template_copy', storeId, jobId);
        alert('応募メッセージをコピーしました!');
      }).catch(() => alert('コピーできませんでした'));
    }
    function closeModal() {
      document.getElementById('modalBg').classList.remove('show');
    }

    // ---------- 共通 ----------
    function esc(s) {
      return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function escAttr(s) { return esc(s).replace(/'/g, '&#39;'); }

    init();
  </script>
</body>
</html>
