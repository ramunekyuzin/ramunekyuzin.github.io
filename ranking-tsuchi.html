<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帝ランキング入賞通知 作成</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f4f2f8;
    margin: 0;
    padding: 16px;
    color: #2c2c2c;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 {
    font-size: 18px;
    margin: 8px 0 16px;
    text-align: center;
    color: #4a3b6b;
  }
  .back-link {
    display: inline-block;
    font-size: 13px;
    color: #7a5fb0;
    text-decoration: none;
    margin-bottom: 10px;
  }
  .back-link:active { opacity: .7; }
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin: 12px 0 4px;
  }
  label:first-child { margin-top: 0; }
  input[type="text"], input[type="number"] {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
  }
  input:focus { outline: none; border-color: #7a5fb0; background: #fff; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    padding: 10px 12px;
    background: #f7f5fb;
    border-radius: 8px;
  }
  .toggle-row span { font-size: 14px; font-weight: 600; color: #555; }
  .switch {
    position: relative;
    width: 46px;
    height: 26px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer;
    top: 0; left: 0; right: 0; bottom: 0;
    background: #ccc; border-radius: 26px;
    transition: .2s;
  }
  .slider:before {
    content: ""; position: absolute;
    height: 20px; width: 20px; left: 3px; bottom: 3px;
    background: white; border-radius: 50%;
    transition: .2s;
  }
  input:checked + .slider { background: #7a5fb0; }
  input:checked + .slider:before { transform: translateX(20px); }
  .calc-preview {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }
  .calc-box {
    flex: 1;
    background: #f7f5fb;
    border-radius: 8px;
    padding: 10px;
    text-align: center;
  }
  .calc-box .label { font-size: 11px; color: #888; margin-bottom: 2px; }
  .calc-box .value { font-size: 17px; font-weight: 700; color: #4a3b6b; }
  textarea {
    width: 100%;
    min-height: 260px;
    font-size: 14px;
    line-height: 1.7;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fafafa;
    resize: vertical;
    font-family: inherit;
    white-space: pre-wrap;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 10px;
    background: #7a5fb0;
    color: #fff;
    margin-top: 10px;
    cursor: pointer;
  }
  button:active { background: #634a94; }
  button.copied { background: #4caf7d; }
  .sub { font-size: 11px; color: #999; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="./teitop.html">‹ 一覧に戻る</a>
  <h1>🏆 帝ランキング入賞通知</h1>

  <div class="card">
    <label>セラピスト名</label>
    <input type="text" id="name" placeholder="例: 〇〇">

    <label>対象年月度</label>
    <input type="text" id="yearMonth">

    <div class="row2">
      <div>
        <label>合計ポイント</label>
        <input type="number" id="totalPt" placeholder="0" inputmode="numeric">
      </div>
      <div>
        <label>応援ポイント</label>
        <input type="number" id="ouenPt" placeholder="0" inputmode="numeric">
      </div>
    </div>

    <div class="toggle-row">
      <span>本部からの支給ラインを入れる</span>
      <label class="switch">
        <input type="checkbox" id="honbuToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <div class="calc-preview">
      <div class="calc-box">
        <div class="label">ボーナス円(pt×1,000)</div>
        <div class="value" id="bonusView">¥0</div>
      </div>
      <div class="calc-box">
        <div class="label">帝コイン(円÷2)</div>
        <div class="value" id="coinView">0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <label style="margin-top:0;">生成された文面</label>
    <textarea id="output" readonly></textarea>
    <button id="copyBtn" onclick="copyText()">コピー</button>
    <div class="sub">入力すると自動でリアルタイム更新されます</div>
  </div>
</div>

<script>
  const nameEl = document.getElementById('name');
  const ymEl = document.getElementById('yearMonth');
  const totalEl = document.getElementById('totalPt');
  const ouenEl = document.getElementById('ouenPt');
  const honbuEl = document.getElementById('honbuToggle');
  const outputEl = document.getElementById('output');
  const bonusView = document.getElementById('bonusView');
  const coinView = document.getElementById('coinView');

  // 年月自動取得(今月度)
  const now = new Date();
  ymEl.value = `${now.getFullYear()}年${now.getMonth() + 1}月度`;

  function fmt(n) {
    return Number(n || 0).toLocaleString('ja-JP');
  }

  function update() {
    const name = nameEl.value.trim() || '〇〇';
    const ym = ymEl.value.trim();
    const total = Number(totalEl.value) || 0;
    const ouen = Number(ouenEl.value) || 0;
    const bonus = total * 1000;
    const coin = Math.round(bonus / 2);

    bonusView.textContent = '¥' + fmt(bonus);
    coinView.textContent = fmt(coin);

    const honbuLine = honbuEl.checked ? '※本部からの支給はポイントになります。\n' : '';

    const text =
`${name}様
いつもセラピスト活動おつかれさまです。
帝事務局の篠原です。
${ym}、帝ランキングへの入賞おめでとうございます。
今回のポイントは（応援${fmt(ouen)}ポイント）${fmt(total)}ポイントです。
${honbuLine}ボーナス${fmt(bonus)}円については他の報酬分から相殺して振り込み必ず詳細メールを送信下さい。
月中に相殺できない場合はこちらから振り込みますのでご連絡ください。
また、同時に帝コイン${fmt(coin)}コインを進呈します。
こちらは追加研修や検査キット、備品の購入代として利用可能です。`;

    outputEl.value = text;
  }

  [nameEl, ymEl, totalEl, ouenEl, honbuEl].forEach(el => {
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });

  function copyText() {
    outputEl.select();
    outputEl.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(outputEl.value).then(() => {
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'コピーしました✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = original;
        btn.classList.remove('copied');
      }, 1500);
    });
  }

  update();
</script>
</body>
</html>
