<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>運営管理｜ラムネ</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2FAFD; --ink: #1F3540; --sub: #6A8A99;
    --primary: #2E9CD4; --primary-soft: #DFF2FB; --deep: #175A80;
    --gold: #B8862B; --ng: #C0392B; --ok: #1A8A3C;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans JP', -apple-system, "Hiragino Sans", sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.7; font-size: 15px;
    max-width: 560px; margin: 0 auto; padding: 16px;
  }
  h1 { font-family: 'Zen Maru Gothic', sans-serif; font-weight: 900; font-size: 22px; color: var(--deep); margin-bottom: 4px; }
  .sub { font-size: 12px; color: var(--sub); margin-bottom: 16px; }
  .card {
    background: #fff; border-radius: 16px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 2px 10px rgba(23,90,128,.08);
  }
  .card h2 { font-size: 13px; font-weight: 700; color: var(--primary); letter-spacing: .1em; margin-bottom: 10px; }
  label { display: block; font-size: 13px; color: var(--sub); margin-bottom: 4px; }
  input {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1.5px solid #C3E2F2; border-radius: 10px; margin-bottom: 10px;
    font-family: inherit; color: var(--ink);
  }
  input:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  button {
    width: 100%; padding: 14px; font-size: 15px; font-weight: 700;
    border: none; border-radius: 12px; background: var(--primary); color: #fff; cursor: pointer;
  }
  button:active { opacity: .85; }
  button:disabled { background: #A9C6D6; }
  .btn-sub { background: #fff; color: var(--sub); border: 1.5px solid #C3E2F2; margin-top: 8px; }
  .hidden { display: none; }
  #status, #dashStatus { text-align: center; font-size: 14px; margin-top: 8px; min-height: 20px; }
  .ok { color: var(--ok); } .ng { color: var(--ng); }

  /* 店舗行 */
  .store-row { border: 1.5px solid #E2F0F8; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
  .store-head { display: flex; align-items: center; gap: 8px; }
  .store-name { font-weight: 700; flex: 1; font-size: 15px; }
  .store-id { font-size: 11px; color: var(--sub); }
  .pill {
    font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 12px; border: none; cursor: pointer;
    flex: 0 0 auto; width: auto;
  }
  .pill.pub { background: #DFF5E6; color: var(--ok); }
  .pill.unpub { background: #F5E2DF; color: var(--ng); }
  .store-meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .store-stats { font-size: 12px; color: var(--deep); margin-top: 4px; }
  .store-tools { display: flex; gap: 6px; margin-top: 8px; }
  .store-tools input { margin-bottom: 0; padding: 9px; font-size: 14px; }
  .store-tools .w-order { flex: 0 0 74px; }
  .store-tools button { width: auto; flex: 0 0 auto; padding: 9px 14px; font-size: 13px; border-radius: 10px; }

  /* 日別ミニ表 */
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid #EAF4FA; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--sub); font-weight: 500; }
</style>
</head>
<body>

<h1>ラムネ 運営管理</h1>
<div class="sub">店舗の追加・公開切替・パスワード発行・全体実績</div>

<!-- ログイン -->
<div id="loginView">
  <div class="card">
    <h2>運営者ログイン</h2>
    <label>運営パスワード</label>
    <input id="loginPw" type="password" autocomplete="current-password">
    <button id="loginBtn" onclick="doLogin()">ログインする</button>
    <div id="status"></div>
  </div>
</div>

<!-- ダッシュボード -->
<div id="dashView" class="hidden">

  <div class="card">
    <h2>新しい店舗を追加</h2>
    <div style="display:flex;gap:8px;">
      <input id="a_id" placeholder="店舗ID (例: S002)" style="flex:0 0 40%;">
      <input id="a_name" placeholder="店名">
    </div>
    <div style="display:flex;gap:8px;">
      <input id="a_pref" placeholder="都道府県 (千葉県)">
      <input id="a_area" placeholder="エリア (栄町)">
      <input id="a_genre" placeholder="業種">
    </div>
    <button onclick="addStore()">追加する(非公開で作成)</button>
    <div id="dashStatus"></div>
  </div>

  <div class="card">
    <h2>店舗一覧</h2>
    <div id="storeRows">読み込み中...</div>
  </div>

  <div class="card">
    <h2>日別実績(直近14日)</h2>
    <table>
      <thead><tr><th>日付</th><th>PV</th><th>詳細</th><th>応募</th><th>LINE友だち</th></tr></thead>
      <tbody id="dayRows"></tbody>
    </table>
    <button class="btn-sub" onclick="loadDash()">更新する</button>
    <button class="btn-sub" onclick="logout()">ログアウト</button>
  </div>
</div>

<script>
// ================================================
// 設定
// ================================================
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwywJH85jgJCjqEtsY47r4jA9SIOPoIGEN2dfXSGIJarzktdDBhoJpa4KdNU5nbWVie/exec';
const TOKEN_KEY = 'ramune_owner_token';

// ================================================
// 共通
// ================================================
function api(body) {
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' }, // プリフライト回避
    body: JSON.stringify(body),
  }).then(r => r.json());
}
function getToken() { try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; } }
function setToken(t) { try { localStorage.setItem(TOKEN_KEY, t); } catch (e) {} }
function clearToken() { try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
function setStatus(elId, msg, ok) {
  const el = document.getElementById(elId);
  el.textContent = msg; el.className = ok ? 'ok' : 'ng';
}
function show(viewId) {
  document.getElementById('loginView').classList.toggle('hidden', viewId !== 'loginView');
  document.getElementById('dashView').classList.toggle('hidden', viewId !== 'dashView');
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

// ================================================
// ログイン
// ================================================
async function doLogin() {
  const pw = document.getElementById('loginPw').value;
  if (!pw) { setStatus('status', 'パスワードを入れてね', false); return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  setStatus('status', 'ログイン中...', true);
  try {
    const res = await api({ action: 'ownerLogin', password: pw });
    if (!res.ok) throw new Error(res.error);
    setToken(res.result.token);
    document.getElementById('loginPw').value = '';
    await loadDash();
  } catch (err) {
    setStatus('status', String(err.message || err), false);
  }
  btn.disabled = false;
}

function logout() { clearToken(); show('loginView'); }

// ================================================
// ダッシュボード
// ================================================
let statsByStore = {};

async function loadDash() {
  const token = getToken();
  if (!token) { show('loginView'); return; }
  try {
    const [listRes, statsRes] = await Promise.all([
      api({ action: 'ownerList', token: token }),
      api({ action: 'ownerStats', token: token }),
    ]);
    if (!listRes.ok) throw new Error(listRes.error);
    if (!statsRes.ok) throw new Error(statsRes.error);

    statsByStore = {};
    statsRes.result.stores.forEach(s => statsByStore[s.id] = s);

    renderStores(listRes.result);
    renderDays(statsRes.result.days);
    show('dashView');
    setStatus('dashStatus', '', true);
  } catch (err) {
    clearToken();
    show('loginView');
    setStatus('status', String(err.message || err), false);
  }
}

function renderStores(stores) {
  const el = document.getElementById('storeRows');
  if (!stores.length) { el.innerHTML = '<div style="color:var(--sub);font-size:13px;">まだ店舗がないよ。上のフォームから追加してね。</div>'; return; }
  el.innerHTML = stores.map(s => {
    const st = statsByStore[s.id] || { detail: 0, line: 0, tel: 0 };
    return `
    <div class="store-row">
      <div class="store-head">
        <div class="store-name">${esc(s.name)} <span class="store-id">${esc(s.id)}</span></div>
        <button class="pill ${s.published ? 'pub' : 'unpub'}" onclick="togglePub('${esc(s.id)}', ${s.published})">
          ${s.published ? '公開中' : '非公開'}
        </button>
      </div>
      <div class="store-meta">${esc(s.pref)} ${esc(s.area)}｜${esc(s.genre)}</div>
      <div class="store-stats">詳細閲覧 ${st.detail}｜LINE応募 ${st.line}｜電話応募 ${st.tel}</div>
      <div class="store-tools">
        <input class="w-order" type="number" value="${s.order === 999 ? '' : s.order}" placeholder="順" id="ord_${esc(s.id)}">
        <button onclick="saveOrder('${esc(s.id)}')">順を保存</button>
        <input type="password" placeholder="新パスワード" id="pw_${esc(s.id)}" autocomplete="new-password">
        <button onclick="issuePw('${esc(s.id)}')">PW発行</button>
      </div>
    </div>`;
  }).join('');
}

function renderDays(days) {
  document.getElementById('dayRows').innerHTML = days.map(d =>
    `<tr><td>${esc(d.label)}</td><td>${d.pv}</td><td>${d.detail}</td><td>${d.apply}</td><td>${d.friend}</td></tr>`
  ).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--sub);">まだデータがないよ</td></tr>';
}

// ================================================
// 操作
// ================================================
async function addStore() {
  const data = {
    id: document.getElementById('a_id').value.trim(),
    name: document.getElementById('a_name').value.trim(),
    pref: document.getElementById('a_pref').value.trim(),
    area: document.getElementById('a_area').value.trim(),
    genre: document.getElementById('a_genre').value.trim(),
  };
  if (!data.id || !data.name) { setStatus('dashStatus', '店舗IDと店名は必須だよ', false); return; }
  try {
    const res = await api({ action: 'ownerAdd', token: getToken(), data: data });
    if (!res.ok) throw new Error(res.error);
    ['a_id','a_name','a_pref','a_area','a_genre'].forEach(id => document.getElementById(id).value = '');
    setStatus('dashStatus', data.id + ' を追加したよ(非公開)。パスワードも発行してね', true);
    await loadDash();
  } catch (err) {
    setStatus('dashStatus', String(err.message || err), false);
  }
}

async function togglePub(id, current) {
  try {
    const res = await api({ action: 'ownerUpdate', token: getToken(), storeId: id, data: { published: !current } });
    if (!res.ok) throw new Error(res.error);
    await loadDash();
  } catch (err) {
    setStatus('dashStatus', String(err.message || err), false);
  }
}

async function saveOrder(id) {
  const v = document.getElementById('ord_' + id).value;
  try {
    const res = await api({ action: 'ownerUpdate', token: getToken(), storeId: id, data: { order: Number(v) || 999 } });
    if (!res.ok) throw new Error(res.error);
    setStatus('dashStatus', id + ' の表示順を保存したよ', true);
    await loadDash();
  } catch (err) {
    setStatus('dashStatus', String(err.message || err), false);
  }
}

async function issuePw(id) {
  const pw = document.getElementById('pw_' + id).value;
  if (!pw) { setStatus('dashStatus', 'パスワードを入れてね', false); return; }
  try {
    const res = await api({ action: 'ownerSetPassword', token: getToken(), storeId: id, password: pw });
    if (!res.ok) throw new Error(res.error);
    document.getElementById('pw_' + id).value = '';
    setStatus('dashStatus', id + ' のパスワードを設定したよ。店に伝えてね', true);
  } catch (err) {
    setStatus('dashStatus', String(err.message || err), false);
  }
}

// 起動時: トークンがあれば自動ログイン
loadDash();
</script>
</body>
</html>
